# Cloud relay + automatic HTTPS. Run on any small VPS (1 vCPU / 1 GB is plenty).
#   cd deploy && cp .env.example .env && edit .env && docker compose up -d
services:
  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      - VAYUVEER_TOKEN=${VAYUVEER_TOKEN}
      - VAYUVEER_USERS_FILE=/data/users.json
      - VAYUVEER_LOG_DIR=/data/flights
      - VAYUVEER_MAX_LOG_GB=${VAYUVEER_MAX_LOG_GB:-6}
    volumes:
      - ./users.json:/data/users.json
      - ./flights:/data/flights          # flight logs + video recordings
    restart: unless-stopped
    expose: ["8000"]

  # Always-on simulated aircraft so the dashboard can be demonstrated without hardware.
  demo-drone:
    build:
      context: ..
      dockerfile: drone/Dockerfile
    environment:
      - VAYUVEER_TOKEN=${VAYUVEER_TOKEN}
      - VAYUVEER_SERVER_URL=ws://relay:8000
      - VAYUVEER_DRONE_ID=demo-01
    restart: unless-stopped
    depends_on: [relay]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]

volumes:
  caddy_data:
  caddy_config:
